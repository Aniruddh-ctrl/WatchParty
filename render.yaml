services:
  # ========================================================
  # Option 1: Unified Single-Service Deployment (Recommended)
  # Builds both client & server, and serves the UI + WebSockets on one URL
  # ========================================================
  - type: web
    name: youtube-watch-party
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --prefix client && npm install --prefix server && npm run build --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
